<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Movie Watchlist{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .navbar-brand { letter-spacing: .2px; }
    .card { border: 0; box-shadow: 0 4px 18px rgba(25, 40, 70, .06); }
    .content { max-width: 1050px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container content">
    <a class="navbar-brand fw-semibold" href="{% url 'movie-list' %}">🎬 Movie Watchlist</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      {% if user.is_authenticated %}
        <span class="text-white-50 small">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Çıxış</button></form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Daxil ol</a>
        <a class="btn btn-warning btn-sm" href="{% url 'signup' %}">Qeydiyyat</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container content py-4 py-md-5">
  {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bağla"></button></div>{% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
